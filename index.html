<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NEON VOID — Infinite Arcade</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Share+Tech+Mono&display=swap');

  :root {
    --neon-cyan: #00ffff;
    --neon-pink: #ff00ff;
    --neon-yellow: #ffff00;
    --neon-green: #00ff88;
    --neon-orange: #ff6600;
    --neon-purple: #aa00ff;
    --bg: #020408;
    --grid: rgba(0,255,255,0.04);
  }

  * { margin:0; padding:0; box-sizing:border-box; }

  body {
    background: var(--bg);
    font-family: 'Orbitron', monospace;
    overflow: hidden;
    height: 100vh;
    width: 100vw;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    user-select: none;
  }

  /* GRID BACKGROUND */
  body::before {
    content:'';
    position:fixed;
    inset:0;
    background-image:
      linear-gradient(var(--grid) 1px, transparent 1px),
      linear-gradient(90deg, var(--grid) 1px, transparent 1px);
    background-size: 40px 40px;
    pointer-events:none;
    z-index:0;
  }

  /* VIGNETTE */
  body::after {
    content:'';
    position:fixed;
    inset:0;
    background: radial-gradient(ellipse at center, transparent 40%, #020408 100%);
    pointer-events:none;
    z-index:1;
  }

  canvas {
    position: relative;
    z-index: 10;
    border: 1px solid rgba(0,255,255,0.15);
    box-shadow:
      0 0 30px rgba(0,255,255,0.15),
      0 0 80px rgba(0,255,255,0.05),
      inset 0 0 30px rgba(0,0,0,0.8);
  }

  #ui {
    position: fixed;
    top: 0; left: 0; right: 0;
    z-index: 20;
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    padding: 16px 24px;
    pointer-events: none;
  }

  .ui-block {
    display: flex;
    flex-direction: column;
    gap: 4px;
  }

  .label {
    font-family: 'Share Tech Mono', monospace;
    font-size: 10px;
    letter-spacing: 3px;
    color: rgba(0,255,255,0.4);
    text-transform: uppercase;
  }

  .value {
    font-family: 'Orbitron', monospace;
    font-size: 22px;
    font-weight: 900;
    color: var(--neon-cyan);
    text-shadow: 0 0 10px var(--neon-cyan), 0 0 30px rgba(0,255,255,0.5);
    letter-spacing: 2px;
  }

  .value.pink { color: var(--neon-pink); text-shadow: 0 0 10px var(--neon-pink), 0 0 30px rgba(255,0,255,0.5); }
  .value.yellow { color: var(--neon-yellow); text-shadow: 0 0 10px var(--neon-yellow), 0 0 30px rgba(255,255,0,0.5); }
  .value.green { color: var(--neon-green); text-shadow: 0 0 10px var(--neon-green); }

  #level-banner {
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%) scale(0);
    z-index: 100;
    text-align: center;
    pointer-events: none;
    transition: transform 0.3s cubic-bezier(0.34,1.56,0.64,1);
  }

  #level-banner.show { transform: translate(-50%, -50%) scale(1); }

  #level-banner .big {
    font-size: clamp(48px, 10vw, 100px);
    font-weight: 900;
    letter-spacing: 8px;
    background: linear-gradient(135deg, var(--neon-cyan), var(--neon-pink));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    filter: drop-shadow(0 0 20px rgba(0,255,255,0.8));
    line-height: 1;
  }

  #level-banner .sub {
    font-family: 'Share Tech Mono', monospace;
    font-size: clamp(12px, 2vw, 18px);
    color: rgba(255,255,255,0.6);
    letter-spacing: 6px;
    margin-top: 8px;
  }

  #start-screen, #gameover-screen {
    position: fixed;
    inset: 0;
    z-index: 200;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: radial-gradient(ellipse at center, rgba(0,255,255,0.03) 0%, #020408 70%);
  }

  #gameover-screen { display: none; }

  .screen-title {
    font-size: clamp(36px, 8vw, 80px);
    font-weight: 900;
    letter-spacing: 6px;
    margin-bottom: 8px;
    animation: glitch 3s infinite;
  }

  .screen-title span:first-child { color: var(--neon-cyan); text-shadow: 0 0 20px var(--neon-cyan), 0 0 60px rgba(0,255,255,0.4); }
  .screen-title span:last-child { color: var(--neon-pink); text-shadow: 0 0 20px var(--neon-pink); }

  .screen-sub {
    font-family: 'Share Tech Mono', monospace;
    font-size: clamp(10px, 2vw, 14px);
    color: rgba(255,255,255,0.35);
    letter-spacing: 5px;
    text-transform: uppercase;
    margin-bottom: 48px;
  }

  .screen-desc {
    font-family: 'Share Tech Mono', monospace;
    font-size: clamp(10px, 1.5vw, 13px);
    color: rgba(0,255,255,0.5);
    letter-spacing: 2px;
    text-align: center;
    line-height: 1.8;
    margin-bottom: 48px;
    max-width: 500px;
  }

  .btn {
    font-family: 'Orbitron', monospace;
    font-size: clamp(12px, 2vw, 16px);
    font-weight: 700;
    letter-spacing: 4px;
    padding: 16px 48px;
    border: 1px solid var(--neon-cyan);
    background: transparent;
    color: var(--neon-cyan);
    cursor: pointer;
    text-transform: uppercase;
    position: relative;
    overflow: hidden;
    transition: all 0.3s;
    box-shadow: 0 0 20px rgba(0,255,255,0.2), inset 0 0 20px rgba(0,255,255,0.05);
  }

  .btn::before {
    content: '';
    position: absolute;
    top: 0; left: -100%;
    width: 100%; height: 100%;
    background: linear-gradient(90deg, transparent, rgba(0,255,255,0.15), transparent);
    transition: left 0.4s;
  }

  .btn:hover { background: rgba(0,255,255,0.1); box-shadow: 0 0 40px rgba(0,255,255,0.4); transform: scale(1.03); }
  .btn:hover::before { left: 100%; }

  .controls-hint {
    position: fixed;
    bottom: 16px;
    left: 50%;
    transform: translateX(-50%);
    font-family: 'Share Tech Mono', monospace;
    font-size: 11px;
    color: rgba(255,255,255,0.2);
    letter-spacing: 3px;
    z-index: 20;
    text-align: center;
  }

  #combo-display {
    position: fixed;
    top: 50%;
    right: 24px;
    transform: translateY(-50%);
    z-index: 20;
    text-align: right;
    pointer-events: none;
  }

  #combo-display .combo-val {
    font-size: clamp(24px, 5vw, 48px);
    font-weight: 900;
    color: var(--neon-yellow);
    text-shadow: 0 0 20px var(--neon-yellow);
    opacity: 0;
    transition: opacity 0.3s;
  }

  #combo-display.active .combo-val { opacity: 1; }

  #lives-display {
    display: flex;
    gap: 8px;
    margin-top: 6px;
  }

  .heart {
    font-size: 16px;
    filter: drop-shadow(0 0 6px rgba(255,0,100,0.8));
    transition: all 0.3s;
  }
  .heart.lost { opacity: 0.15; filter: none; }

  @keyframes glitch {
    0%,92%,100% { transform: none; }
    93% { transform: translate(-2px, 0) skewX(-2deg); }
    94% { transform: translate(2px, 0) skewX(2deg); }
    95% { transform: translate(-1px, 0); }
    96% { transform: translate(1px, 0) skewX(-1deg); }
    97% { transform: none; }
  }

  @keyframes floatScore {
    0%   { opacity: 1; transform: translateY(0); }
    100% { opacity: 0; transform: translateY(-60px); }
  }

  .float-score {
    position: fixed;
    font-family: 'Orbitron', monospace;
    font-weight: 900;
    font-size: 20px;
    pointer-events: none;
    z-index: 50;
    animation: floatScore 1.2s ease-out forwards;
  }

  #mobile-controls {
    display: none;
    position: fixed;
    bottom: 20px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 30;
    gap: 12px;
  }

  .mob-btn {
    width: 56px; height: 56px;
    border: 1px solid rgba(0,255,255,0.3);
    background: rgba(0,255,255,0.05);
    color: var(--neon-cyan);
    font-size: 20px;
    cursor: pointer;
    border-radius: 4px;
    display: flex; align-items: center; justify-content: center;
    backdrop-filter: blur(4px);
    -webkit-tap-highlight-color: transparent;
    transition: background 0.15s;
  }

  .mob-btn:active { background: rgba(0,255,255,0.2); }

  @media (max-width: 600px) or (pointer: coarse) {
    #mobile-controls { display: flex; }
    .controls-hint { bottom: 90px; }
  }

  #go-score { font-size: clamp(40px,10vw,90px); font-weight:900; color:var(--neon-pink); text-shadow:0 0 30px var(--neon-pink); margin:16px 0; }
  #go-best  { font-family:'Share Tech Mono',monospace; font-size:14px; color:rgba(255,255,255,0.4); letter-spacing:4px; margin-bottom:32px; }
</style>
</head>
<body>

<!-- START SCREEN -->
<div id="start-screen">
  <div class="screen-title"><span>NEON</span> <span>VOID</span></div>
  <div class="screen-sub">∞ Infinite Arcade · Level Zero</div>
  <div class="screen-desc">
    DODGE · COLLECT · SURVIVE<br>
    Each level brings new chaos<br>
    How deep can you go?
  </div>
  <button class="btn" id="start-btn">ENTER THE VOID</button>
  <br><br>
  <div style="font-family:'Share Tech Mono',monospace;font-size:11px;color:rgba(255,255,255,0.2);letter-spacing:3px;text-align:center">
    ← → MOVE &nbsp;·&nbsp; SPACE / ↑ JUMP &nbsp;·&nbsp; DOUBLE-JUMP UNLOCKS LVL 3
  </div>
</div>

<!-- GAME OVER SCREEN -->
<div id="gameover-screen">
  <div class="screen-title"><span>GAME</span> <span>OVER</span></div>
  <div id="go-score">0</div>
  <div id="go-best">BEST: 0</div>
  <button class="btn" id="restart-btn">PLAY AGAIN</button>
</div>

<!-- HUD -->
<div id="ui">
  <div class="ui-block">
    <div class="label">Score</div>
    <div class="value" id="hud-score">0</div>
  </div>
  <div class="ui-block" style="align-items:center">
    <div class="label">Level</div>
    <div class="value yellow" id="hud-level">1</div>
  </div>
  <div class="ui-block" style="align-items:flex-end">
    <div class="label">Lives</div>
    <div id="lives-display"></div>
  </div>
</div>

<!-- COMBO -->
<div id="combo-display">
  <div class="combo-val" id="combo-val">x1</div>
  <div class="label" style="font-size:9px;color:rgba(255,255,0,0.4);text-align:right">COMBO</div>
</div>

<!-- LEVEL BANNER -->
<div id="level-banner">
  <div class="big" id="banner-text">LEVEL 1</div>
  <div class="sub" id="banner-sub">SURVIVE THE VOID</div>
</div>

<!-- CANVAS -->
<canvas id="c"></canvas>

<!-- CONTROLS HINT -->
<div class="controls-hint">← → MOVE &nbsp;·&nbsp; SPACE/↑ JUMP</div>

<!-- MOBILE CONTROLS -->
<div id="mobile-controls">
  <button class="mob-btn" id="mob-left">◀</button>
  <button class="mob-btn" id="mob-jump">▲</button>
  <button class="mob-btn" id="mob-right">▶</button>
</div>

<script>
// ═══════════════════════════════════════════════════════
//  NEON VOID — Infinite Arcade Engine
// ═══════════════════════════════════════════════════════

const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');

// Resize canvas
function resize() {
  const maxW = Math.min(window.innerWidth - 0, 900);
  const maxH = Math.min(window.innerHeight - 80, 600);
  const ratio = 3/2;
  let w = maxW, h = w / ratio;
  if (h > maxH) { h = maxH; w = h * ratio; }
  canvas.width  = Math.floor(w);
  canvas.height = Math.floor(h);
}
resize();
window.addEventListener('resize', () => { resize(); if(G.running) layoutPlatforms(); });

// ── GLOBAL STATE ─────────────────────────────────────
const G = {
  running: false,
  score: 0,
  best: +localStorage.getItem('nv_best') || 0,
  level: 1,
  lives: 3,
  combo: 1,
  comboTimer: 0,
  time: 0,
  particles: [],
  floaters: [],
  effects: [],
  shake: 0,
  shakeX: 0, shakeY: 0,
  bgHue: 180,
};

// ── LEVEL CONFIGS (scalable formula) ─────────────────
function getLevelConfig(lvl) {
  const base = {
    platformCount: Math.min(7 + Math.floor(lvl * 0.5), 14),
    enemyCount: Math.floor(lvl * 0.8),
    orbCount: 3 + Math.floor(lvl * 0.4),
    enemySpeed: 0.8 + lvl * 0.18,
    platformSpeed: Math.min(0.4 + lvl * 0.12, 3.5),
    gapSize: Math.min(60 + lvl * 3, 160),
    hasSpikers: lvl >= 2,
    hasDroids: lvl >= 3,
    hasGhosts: lvl >= 5,
    hasBoss: lvl % 5 === 0 && lvl > 0,
    doubleJump: lvl >= 3,
    gravityMult: 1 + Math.min(lvl * 0.02, 0.5),
    colorCycle: lvl >= 4,
    bgHue: (lvl * 37) % 360,
  };
  return base;
}

function getLevelName(lvl) {
  const names = [
    '', 'AWAKENING','STATIC SURGE','DOUBLE TROUBLE','GHOST PROTOCOL',
    'BOSS ENCOUNTER','HYPER FLUX','VOID STORM','NEON RAIN','CHAOS ENGINE',
    'SINGULARITY'
  ];
  if (lvl <= 10) return names[lvl] || `VOID LEVEL ${lvl}`;
  if (lvl <= 20) return `DARK ZONE ${lvl}`;
  if (lvl <= 50) return `ULTRA VOID ${lvl}`;
  return `∞ INFINITE ${lvl}`;
}

// ── PLAYER ─────────────────────────────────────────
const P = {
  x: 0, y: 0, w: 28, h: 28,
  vx: 0, vy: 0,
  grounded: false,
  jumps: 0,
  maxJumps: 1,
  color: '#00ffff',
  trail: [],
  invincible: 0,
  dashCooldown: 0,
  alive: true,
};

function initPlayer() {
  P.x = canvas.width * 0.15;
  P.y = canvas.height * 0.5;
  P.vx = 0; P.vy = 0;
  P.grounded = false;
  P.jumps = 0;
  P.trail = [];
  P.invincible = 0;
  P.alive = true;
  P.maxJumps = getLevelConfig(G.level).doubleJump ? 2 : 1;
}

// ── PLATFORMS ──────────────────────────────────────
let platforms = [];

function makePlatform(x, y, w) {
  const col = `hsl(${G.bgHue + Math.random()*40},100%,55%)`;
  return {
    x, y, w, h: 14,
    color: col,
    scrollSpeed: getLevelConfig(G.level).platformSpeed,
    hasCoin: Math.random() > 0.45,
    hasSpike: getLevelConfig(G.level).hasSpikers && Math.random() > 0.72,
    coinColl: false,
    pulse: Math.random() * Math.PI * 2,
  };
}

function layoutPlatforms() {
  platforms = [];
  const cfg = getLevelConfig(G.level);
  const H = canvas.height, W = canvas.width;
  // Ground
  platforms.push({ x:0, y:H-30, w:W*2, h:14, color:'#00ffff', scrollSpeed:cfg.platformSpeed, hasCoin:false, hasSpike:false, coinColl:false, pulse:0 });
  // Scattered
  const count = cfg.platformCount;
  for (let i = 0; i < count; i++) {
    const pw = 80 + Math.random() * 80;
    const px = 100 + Math.random() * (W - 200);
    const py = H * 0.2 + Math.random() * (H * 0.55);
    platforms.push(makePlatform(px, py, pw));
  }
}

// ── ENEMIES ────────────────────────────────────────
let enemies = [];

function spawnEnemies() {
  enemies = [];
  const cfg = getLevelConfig(G.level);
  for (let i = 0; i < cfg.enemyCount; i++) {
    const type = cfg.hasGhosts && Math.random() > 0.6 ? 'ghost'
               : cfg.hasDroids && Math.random() > 0.5 ? 'droid'
               : 'basic';
    enemies.push({
      x: canvas.width * 0.5 + Math.random() * canvas.width * 0.4,
      y: canvas.height * 0.2 + Math.random() * canvas.height * 0.5,
      w: 24, h: 24,
      vx: (Math.random() > 0.5 ? 1 : -1) * cfg.enemySpeed,
      vy: 0,
      type,
      hp: type === 'ghost' ? 2 : 1,
      phase: Math.random() * Math.PI * 2,
      alive: true,
    });
  }
}

// ── ORBS (collectibles) ────────────────────────────
let orbs = [];

function spawnOrbs() {
  orbs = [];
  const cfg = getLevelConfig(G.level);
  for (let i = 0; i < cfg.orbCount; i++) {
    const types = ['score','score','score','life','speed','double'];
    const t = types[Math.floor(Math.random()*types.length)];
    orbs.push({
      x: 80 + Math.random() * (canvas.width - 160),
      y: 60 + Math.random() * (canvas.height - 120),
      r: 10,
      type: t,
      phase: Math.random() * Math.PI * 2,
      alive: true,
    });
  }
}

// ── INPUT ──────────────────────────────────────────
const keys = {};
window.addEventListener('keydown', e => {
  keys[e.code] = true;
  if ((e.code === 'Space' || e.code === 'ArrowUp' || e.code === 'KeyW') && G.running) {
    doJump();
    e.preventDefault();
  }
});
window.addEventListener('keyup', e => keys[e.code] = false);

// Mobile
document.getElementById('mob-left').addEventListener('touchstart',  e => { keys['ArrowLeft']=true;  e.preventDefault(); }, {passive:false});
document.getElementById('mob-left').addEventListener('touchend',    e => { keys['ArrowLeft']=false; e.preventDefault(); }, {passive:false});
document.getElementById('mob-right').addEventListener('touchstart', e => { keys['ArrowRight']=true; e.preventDefault(); }, {passive:false});
document.getElementById('mob-right').addEventListener('touchend',   e => { keys['ArrowRight']=false;e.preventDefault(); }, {passive:false});
document.getElementById('mob-jump').addEventListener('touchstart',  e => { doJump(); e.preventDefault(); }, {passive:false});

function doJump() {
  if (!G.running || !P.alive) return;
  if (P.grounded || P.jumps < P.maxJumps) {
    P.vy = -14;
    P.jumps++;
    P.grounded = false;
    // Jump particles
    for (let i = 0; i < 8; i++) {
      G.particles.push({
        x: P.x + P.w/2, y: P.y + P.h,
        vx: (Math.random()-0.5)*4,
        vy: Math.random()*3,
        life: 25, maxLife: 25,
        color: P.color,
        size: 3 + Math.random()*3,
      });
    }
  }
}

// ── PHYSICS ────────────────────────────────────────
const GRAVITY = 0.55;
const SPEED   = 4.5;
const FRICTION = 0.85;

function updatePlayer(dt) {
  if (!P.alive) return;
  const cfg = getLevelConfig(G.level);
  const grav = GRAVITY * cfg.gravityMult;

  // Input
  if (keys['ArrowLeft']  || keys['KeyA']) P.vx -= 1.2;
  if (keys['ArrowRight'] || keys['KeyD']) P.vx += 1.2;

  P.vx *= FRICTION;
  P.vx = Math.max(-SPEED, Math.min(SPEED, P.vx));

  P.vy += grav;
  P.vy = Math.min(P.vy, 18);

  P.x += P.vx;
  P.y += P.vy;

  // Wall wrap
  if (P.x + P.w < 0) P.x = canvas.width;
  if (P.x > canvas.width) P.x = -P.w;

  // Platform collision
  P.grounded = false;
  for (const pl of platforms) {
    if (!pl.alive) continue;
    if (P.vy >= 0 &&
        P.x + P.w > pl.x && P.x < pl.x + pl.w &&
        P.y + P.h > pl.y && P.y + P.h < pl.y + pl.h + 16) {
      P.y = pl.y - P.h;
      P.vy = 0;
      P.grounded = true;
      P.jumps = 0;

      if (pl.hasSpike && P.invincible <= 0) takeDamage();
    }
  }

  // Floor & ceiling
  if (P.y + P.h > canvas.height) {
    if (P.invincible <= 0) takeDamage();
    P.y = -P.h;
    P.vy = 0;
  }
  if (P.y < -100) { P.y = canvas.height - 50; }

  // Trail
  P.trail.unshift({ x: P.x + P.w/2, y: P.y + P.h/2 });
  if (P.trail.length > 18) P.trail.pop();

  if (P.invincible > 0) P.invincible--;
}

function takeDamage() {
  if (P.invincible > 0) return;
  G.lives--;
  G.combo = 1;
  P.invincible = 80;
  G.shake = 16;
  updateLivesHUD();

  // Red flash particles
  for (let i = 0; i < 20; i++) {
    G.particles.push({
      x: P.x + P.w/2, y: P.y + P.h/2,
      vx: (Math.random()-0.5)*8, vy: (Math.random()-0.5)*8,
      life: 40, maxLife: 40,
      color: '#ff0055', size: 4 + Math.random()*4,
    });
  }

  if (G.lives <= 0) gameOver();
}

// ── ENEMIES UPDATE ─────────────────────────────────
function updateEnemies() {
  const cfg = getLevelConfig(G.level);
  for (const e of enemies) {
    if (!e.alive) continue;
    e.phase += 0.05;

    if (e.type === 'ghost') {
      // Home in on player
      const dx = (P.x + P.w/2) - (e.x + e.w/2);
      const dy = (P.y + P.h/2) - (e.y + e.h/2);
      const dist = Math.sqrt(dx*dx + dy*dy);
      if (dist > 10) {
        e.x += (dx/dist) * cfg.enemySpeed * 0.7;
        e.y += (dy/dist) * cfg.enemySpeed * 0.7;
      }
    } else if (e.type === 'droid') {
      e.x += e.vx;
      e.y += Math.sin(e.phase) * 2;
      if (e.x < 0 || e.x + e.w > canvas.width) e.vx *= -1;
    } else {
      e.x += e.vx;
      e.y += Math.sin(e.phase * 0.5) * 1.5;
      if (e.x < 20 || e.x + e.w > canvas.width - 20) e.vx *= -1;
    }

    // Collision with player
    if (P.alive && P.invincible <= 0 &&
        P.x + P.w - 6 > e.x && P.x + 6 < e.x + e.w &&
        P.y + P.h - 6 > e.y && P.y + 6 < e.y + e.h) {

      // Stomp from above?
      if (P.vy > 2 && P.y + P.h < e.y + e.h * 0.5) {
        e.hp--;
        if (e.hp <= 0) killEnemy(e);
        P.vy = -10;
        addScore(50 * G.combo, e.x + e.w/2, e.y);
        G.combo++;
      } else {
        takeDamage();
      }
    }
  }
}

function killEnemy(e) {
  e.alive = false;
  for (let i = 0; i < 16; i++) {
    G.particles.push({
      x: e.x + e.w/2, y: e.y + e.h/2,
      vx: (Math.random()-0.5)*9, vy: (Math.random()-0.5)*9,
      life: 45, maxLife: 45,
      color: ['#ff00ff','#00ffff','#ffff00','#ff6600'][Math.floor(Math.random()*4)],
      size: 3 + Math.random()*5,
    });
  }
}

// ── ORBS UPDATE ────────────────────────────────────
function updateOrbs() {
  for (const orb of orbs) {
    if (!orb.alive) continue;
    orb.phase += 0.04;

    const dx = (P.x + P.w/2) - orb.x;
    const dy = (P.y + P.h/2) - orb.y;
    if (Math.sqrt(dx*dx + dy*dy) < P.w/2 + orb.r) {
      orb.alive = false;
      collectOrb(orb);
    }
  }
}

function collectOrb(orb) {
  const pts = { score: 100, life: 200, speed: 150, double: 250 };
  addScore(pts[orb.type] * G.combo, orb.x, orb.y);
  G.combo++;
  G.comboTimer = 120;

  if (orb.type === 'life' && G.lives < 5) {
    G.lives++;
    updateLivesHUD();
    showFloat(orb.x, orb.y - 20, '♥ +1 LIFE', '#ff00aa');
  }

  // Collect particles
  const orbColor = { score:'#ffff00', life:'#ff00aa', speed:'#00ff88', double:'#aa00ff' };
  for (let i = 0; i < 12; i++) {
    G.particles.push({
      x: orb.x, y: orb.y,
      vx: (Math.random()-0.5)*7, vy: (Math.random()-0.5)*7,
      life: 35, maxLife: 35,
      color: orbColor[orb.type],
      size: 3 + Math.random()*4,
    });
  }
}

// ── PARTICLES ──────────────────────────────────────
function updateParticles() {
  for (let i = G.particles.length - 1; i >= 0; i--) {
    const p = G.particles[i];
    p.x += p.vx;
    p.y += p.vy;
    p.vy += 0.12;
    p.life--;
    if (p.life <= 0) G.particles.splice(i, 1);
  }
}

// ── SCORE ──────────────────────────────────────────
function addScore(pts, x, y) {
  G.score += pts;
  document.getElementById('hud-score').textContent = G.score;
  showFloat(x, y, '+' + pts, pts > 200 ? '#ff00ff' : '#ffff00');
  checkLevelUp();
}

function showFloat(x, y, text, color) {
  const el = document.createElement('div');
  el.className = 'float-score';
  el.style.left  = (x + canvas.offsetLeft) + 'px';
  el.style.top   = (y + canvas.offsetTop)  + 'px';
  el.style.color = color;
  el.style.textShadow = `0 0 10px ${color}`;
  el.textContent = text;
  document.body.appendChild(el);
  setTimeout(() => el.remove(), 1200);
}

function checkLevelUp() {
  const threshold = G.level * 500 + (G.level - 1) * 200;
  if (G.score >= threshold) {
    G.level++;
    showLevelBanner();
    layoutPlatforms();
    spawnEnemies();
    spawnOrbs();
    P.maxJumps = getLevelConfig(G.level).doubleJump ? 2 : 1;
    G.bgHue = getLevelConfig(G.level).bgHue;
    document.getElementById('hud-level').textContent = G.level;
  }
}

function showLevelBanner() {
  const b = document.getElementById('level-banner');
  document.getElementById('banner-text').textContent = 'LEVEL ' + G.level;
  document.getElementById('banner-sub').textContent = getLevelName(G.level);
  b.classList.add('show');
  setTimeout(() => b.classList.remove('show'), 2200);
}

// ── DRAW ───────────────────────────────────────────
function draw() {
  const W = canvas.width, H = canvas.height;

  // Screen shake
  if (G.shake > 0) {
    G.shakeX = (Math.random()-0.5) * G.shake;
    G.shakeY = (Math.random()-0.5) * G.shake;
    G.shake *= 0.75;
    if (G.shake < 0.5) G.shake = 0;
  } else {
    G.shakeX = 0; G.shakeY = 0;
  }

  ctx.save();
  ctx.translate(G.shakeX, G.shakeY);

  // Background
  const grad = ctx.createLinearGradient(0, 0, W, H);
  grad.addColorStop(0, `hsl(${G.bgHue},80%,3%)`);
  grad.addColorStop(1, `hsl(${(G.bgHue+60)%360},60%,2%)`);
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, W, H);

  // Scanlines
  ctx.fillStyle = 'rgba(0,0,0,0.12)';
  for (let y = 0; y < H; y += 4) {
    ctx.fillRect(0, y, W, 2);
  }

  // Platforms
  for (const pl of platforms) {
    if (!pl.alive) continue;
    pl.pulse += 0.04;

    const glow = Math.sin(pl.pulse) * 0.3 + 0.7;
    ctx.save();
    ctx.shadowColor = pl.color;
    ctx.shadowBlur  = 10 * glow;

    // Platform body
    const grad = ctx.createLinearGradient(pl.x, pl.y, pl.x, pl.y + pl.h);
    grad.addColorStop(0, pl.color);
    grad.addColorStop(1, 'rgba(0,0,0,0.5)');
    ctx.fillStyle = grad;
    ctx.fillRect(pl.x, pl.y, pl.w, pl.h);

    // Top edge glow
    ctx.fillStyle = 'rgba(255,255,255,0.6)';
    ctx.fillRect(pl.x, pl.y, pl.w, 2);

    // Spike
    if (pl.hasSpike) {
      ctx.fillStyle = '#ff3333';
      ctx.shadowColor = '#ff0000';
      ctx.shadowBlur = 8;
      for (let sx = pl.x + 4; sx < pl.x + pl.w - 4; sx += 12) {
        ctx.beginPath();
        ctx.moveTo(sx, pl.y);
        ctx.lineTo(sx + 5, pl.y - 10);
        ctx.lineTo(sx + 10, pl.y);
        ctx.fill();
      }
    }

    // Coin
    if (pl.hasCoin && !pl.coinColl) {
      ctx.shadowColor = '#ffff00';
      ctx.shadowBlur = 12;
      ctx.fillStyle = '#ffff00';
      ctx.beginPath();
      ctx.arc(pl.x + pl.w/2, pl.y - 16, 7, 0, Math.PI*2);
      ctx.fill();
      ctx.fillStyle = 'rgba(0,0,0,0.5)';
      ctx.font = 'bold 8px Orbitron';
      ctx.textAlign = 'center';
      ctx.fillText('$', pl.x + pl.w/2, pl.y - 13);
    }
    ctx.restore();

    // Coin pickup check
    if (pl.hasCoin && !pl.coinColl &&
        P.x + P.w > pl.x + pl.w/2 - 14 &&
        P.x < pl.x + pl.w/2 + 14 &&
        P.y + P.h > pl.y - 28 &&
        P.y < pl.y - 4) {
      pl.coinColl = true;
      addScore(25 * G.combo, pl.x + pl.w/2, pl.y - 20);
      G.combo++;
      G.comboTimer = 90;
    }
  }

  // Orbs
  for (const orb of orbs) {
    if (!orb.alive) continue;
    orb.phase += 0.04;
    const orbColors = {
      score:  { c:'#ffff00', g:'rgba(255,255,0,0.3)' },
      life:   { c:'#ff00aa', g:'rgba(255,0,150,0.3)' },
      speed:  { c:'#00ff88', g:'rgba(0,255,100,0.3)' },
      double: { c:'#aa00ff', g:'rgba(150,0,255,0.3)' },
    };
    const oc = orbColors[orb.type];
    const oy = orb.y + Math.sin(orb.phase) * 6;
    const spin = orb.phase;

    ctx.save();
    ctx.shadowColor = oc.c;
    ctx.shadowBlur  = 20;
    // Outer glow
    const grd = ctx.createRadialGradient(orb.x, oy, 0, orb.x, oy, orb.r * 2);
    grd.addColorStop(0, oc.c);
    grd.addColorStop(0.5, oc.g);
    grd.addColorStop(1, 'transparent');
    ctx.fillStyle = grd;
    ctx.beginPath();
    ctx.arc(orb.x, oy, orb.r * 2, 0, Math.PI * 2);
    ctx.fill();

    // Core
    ctx.fillStyle = oc.c;
    ctx.beginPath();
    ctx.arc(orb.x, oy, orb.r, 0, Math.PI * 2);
    ctx.fill();

    // Inner symbol
    ctx.fillStyle = 'rgba(0,0,0,0.6)';
    ctx.font = 'bold 11px Orbitron';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    const syms = { score:'★', life:'♥', speed:'⚡', double:'✦' };
    ctx.fillText(syms[orb.type], orb.x, oy);
    ctx.restore();
  }

  // Enemies
  for (const e of enemies) {
    if (!e.alive) continue;
    e.phase += 0.06;

    ctx.save();
    const eColors = { basic:'#ff0055', droid:'#ff6600', ghost:'#aa00ff' };
    const ec = eColors[e.type];
    ctx.shadowColor = ec;
    ctx.shadowBlur  = 15;

    if (e.type === 'ghost') {
      ctx.globalAlpha = 0.6 + Math.sin(e.phase)*0.2;
      ctx.fillStyle = ec;
      ctx.beginPath();
      ctx.arc(e.x + e.w/2, e.y + e.h/2, e.w/2, 0, Math.PI*2);
      ctx.fill();
      // Inner ring
      ctx.globalAlpha = 0.4;
      ctx.strokeStyle = '#ffffff';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.arc(e.x + e.w/2, e.y + e.h/2, e.w/2 - 4, 0, Math.PI*2);
      ctx.stroke();
    } else if (e.type === 'droid') {
      ctx.fillStyle = ec;
      ctx.fillRect(e.x + 4, e.y, e.w - 8, e.h);
      ctx.fillRect(e.x, e.y + 6, e.w, e.h - 12);
      // Eye
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(e.x + e.w/2 - 3, e.y + 6, 6, 6);
    } else {
      // Basic: diamond shape
      ctx.fillStyle = ec;
      ctx.beginPath();
      ctx.moveTo(e.x + e.w/2, e.y);
      ctx.lineTo(e.x + e.w, e.y + e.h/2);
      ctx.lineTo(e.x + e.w/2, e.y + e.h);
      ctx.lineTo(e.x, e.y + e.h/2);
      ctx.closePath();
      ctx.fill();
    }
    ctx.restore();
  }

  // Particles
  for (const p of G.particles) {
    const alpha = p.life / p.maxLife;
    ctx.save();
    ctx.globalAlpha = alpha;
    ctx.shadowColor = p.color;
    ctx.shadowBlur  = 8;
    ctx.fillStyle   = p.color;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.size * alpha, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }

  // Player trail
  for (let i = 0; i < P.trail.length; i++) {
    const t = P.trail[i];
    const alpha = (1 - i/P.trail.length) * 0.5;
    const size  = (1 - i/P.trail.length) * P.w * 0.4;
    ctx.save();
    ctx.globalAlpha = alpha;
    ctx.fillStyle   = P.invincible > 0 ? '#ff5555' : '#00ffff';
    ctx.shadowColor = ctx.fillStyle;
    ctx.shadowBlur  = 8;
    ctx.beginPath();
    ctx.arc(t.x, t.y, size, 0, Math.PI*2);
    ctx.fill();
    ctx.restore();
  }

  // Player
  if (P.alive) {
    const flash = P.invincible > 0 && Math.floor(P.invincible/5) % 2 === 0;
    if (!flash) {
      ctx.save();
      const pc = P.invincible > 0 ? '#ff5555' : '#00ffff';
      ctx.shadowColor = pc;
      ctx.shadowBlur  = 20;

      // Body
      ctx.fillStyle = pc;
      ctx.fillRect(P.x + 4, P.y + 4, P.w - 8, P.h - 8);

      // Corners (pixel art style)
      ctx.fillRect(P.x, P.y + 8, 4, P.h - 16);
      ctx.fillRect(P.x + P.w - 4, P.y + 8, 4, P.h - 16);
      ctx.fillRect(P.x + 8, P.y, P.w - 16, 4);
      ctx.fillRect(P.x + 8, P.y + P.h - 4, P.w - 16, 4);

      // Eye
      ctx.fillStyle = '#000000';
      ctx.fillRect(P.x + 8, P.y + 8, 5, 5);
      ctx.fillRect(P.x + P.w - 13, P.y + 8, 5, 5);
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(P.x + 9, P.y + 9, 2, 2);
      ctx.fillRect(P.x + P.w - 12, P.y + 9, 2, 2);

      ctx.restore();
    }
  }

  ctx.restore(); // end shake
}

// ── COMBO TIMER ────────────────────────────────────
function updateCombo() {
  if (G.combo > 1) {
    G.comboTimer--;
    if (G.comboTimer <= 0) {
      G.combo = 1;
    }
  }

  const cd = document.getElementById('combo-display');
  const cv = document.getElementById('combo-val');
  if (G.combo > 1) {
    cd.classList.add('active');
    cv.textContent = 'x' + G.combo;
    cv.style.transform = 'scale(' + (1 + (G.combo-1)*0.06) + ')';
  } else {
    cd.classList.remove('active');
  }
}

// ── MAIN LOOP ──────────────────────────────────────
let lastTime = 0;
function loop(ts) {
  if (!G.running) return;
  const dt = (ts - lastTime) / 16.67;
  lastTime = ts;

  G.time++;
  G.bgHue = (G.bgHue + 0.1) % 360;

  updatePlayer(dt);
  updateEnemies();
  updateOrbs();
  updateParticles();
  updateCombo();
  draw();

  requestAnimationFrame(loop);
}

// ── GAME START ─────────────────────────────────────
function startGame() {
  G.score = 0;
  G.level = 1;
  G.lives = 3;
  G.combo = 1;
  G.comboTimer = 0;
  G.time = 0;
  G.particles = [];
  G.bgHue = 180;
  G.running = true;

  document.getElementById('hud-score').textContent = '0';
  document.getElementById('hud-level').textContent = '1';
  updateLivesHUD();
  layoutPlatforms();
  spawnEnemies();
  spawnOrbs();
  initPlayer();
  showLevelBanner();

  document.getElementById('start-screen').style.display = 'none';
  document.getElementById('gameover-screen').style.display = 'none';

  requestAnimationFrame(ts => { lastTime = ts; loop(ts); });
}

function gameOver() {
  G.running = false;
  P.alive = false;
  if (G.score > G.best) {
    G.best = G.score;
    localStorage.setItem('nv_best', G.best);
  }
  document.getElementById('go-score').textContent = G.score;
  document.getElementById('go-best').textContent = 'BEST: ' + G.best;
  document.getElementById('gameover-screen').style.display = 'flex';
}

function updateLivesHUD() {
  const ld = document.getElementById('lives-display');
  ld.innerHTML = '';
  for (let i = 0; i < 3; i++) {
    const h = document.createElement('span');
    h.className = 'heart' + (i >= G.lives ? ' lost' : '');
    h.textContent = '♥';
    ld.appendChild(h);
  }
}

document.getElementById('start-btn').addEventListener('click', startGame);
document.getElementById('restart-btn').addEventListener('click', startGame);

// Initial draw
resize();
updateLivesHUD();

// Draw intro canvas (static)
(function drawIntro() {
  const W = canvas.width, H = canvas.height;
  ctx.fillStyle = '#020408';
  ctx.fillRect(0, 0, W, H);
  // Draw a few platforms teaser
  ctx.shadowColor = '#00ffff';
  ctx.shadowBlur = 15;
  ctx.fillStyle = '#00ffff';
  for (let i = 0; i < 5; i++) {
    ctx.fillRect(60 + i*150, 100 + Math.sin(i)*80, 100, 12);
  }
  ctx.fillRect(0, H-30, W, 12);
})();
</script>
